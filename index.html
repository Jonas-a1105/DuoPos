<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DuoPOS - Punto de Venta Gamificado</title>
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#58cc02" />
    <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/2855/2855138.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Registrar Service Worker para caché offline (estrategia network-first)
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', async () => {
          try {
            const registration = await navigator.serviceWorker.register('/sw.js');
            console.log('✅ Service Worker registrado:', registration.scope);
          } catch (err) {
            console.warn('⚠️ Service Worker no se pudo registrar (modo offline no disponible):', err);
          }
        });
      }
    </script>
  </body>
</html>
