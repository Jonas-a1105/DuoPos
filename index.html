<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DuoPOS - Punto de Venta Gamificado</title>
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#58cc02" />
    <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/2855/2855138.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Desregistrar todos los Service Workers activos para solucionar y prevenir bloqueos de caché
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for (let registration of registrations) {
            registration.unregister();
            console.log('🔄 Service Worker desregistrado con éxito para evitar conflictos.');
          }
        });
      }
    </script>
  </body>
</html>
