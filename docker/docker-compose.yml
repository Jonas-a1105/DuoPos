version: '3.8'
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: duopos
      POSTGRES_USER: duopos
      POSTGRES_PASSWORD: duopos_dev
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgresql.conf:/etc/postgresql/postgresql.conf

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    volumes:
      - ./redis.conf:/usr/local/etc/redis/redis.conf

  minio:
    image: minio/minio
    ports:
      - '9000:9000'
      - '9001:9001'
    environment:
      MINIO_ROOT_USER: duopos
      MINIO_ROOT_PASSWORD: duopos_dev
    command: server /data --console-address ':9001'

volumes:
  postgres_data:
